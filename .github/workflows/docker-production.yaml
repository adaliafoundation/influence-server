name: Release production image

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      channel:
        required: false
        default: production
        type: string
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character Git commit SHA to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.channel || 'production' }}-server-release
  cancel-in-progress: false

jobs:
  validate:
    name: Test image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require the main workflow branch and a supported channel
        env:
          CHANNEL: ${{ inputs.channel || 'production' }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$CHANNEL" = production || "$CHANNEL" = prerelease ]]

      - name: Checkout trusted workflow policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require main ancestry before executing candidate code
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: bash scripts/verify-release.sh "$COMMIT_SHA"

      - name: Checkout validated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          path: source
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build unit test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: source
          target: production-test
          load: true
          tags: influence-server:unittest

      - name: Run unit and deployment tests
        run: docker run --rm influence-server:unittest

  build:
    name: Build image
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout trusted workflow policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require main ancestry before executing candidate code
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: bash scripts/verify-release.sh "$COMMIT_SHA"

      - name: Checkout validated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          path: source
          persist-credentials: false

      - name: Set candidate image name
        id: image
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "candidate=$IMAGE:candidate-$COMMIT_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate with SBOM and provenance
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: source
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.candidate }}
          build-args: IMAGE_REVISION=${{ inputs.commit_sha }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.commit_sha }}

  verify:
    name: Verify image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout trusted workflow policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require main ancestry before executing candidate code
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: bash scripts/verify-release.sh "$COMMIT_SHA"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the exact candidate digest
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          fail-build: false
          severity-cutoff: high
          only-fixed: false
          output-format: json
          output-file: vulnerability-report.json

      - name: Enforce reviewed vulnerability policy
        run: node scripts/check-vulnerabilities.cjs vulnerability-report.json security/vulnerability-exceptions.json

      - name: Save vulnerability report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-vulnerability-report
          path: vulnerability-report.json
          if-no-files-found: warn

      - name: Smoke-test the exact candidate digest
        env:
          PRODUCTION_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: bash scripts/test-production-image.sh "$PRODUCTION_IMAGE"

  publish:
    name: ${{ inputs.channel == 'prerelease' && 'Publish prerelease image and request deployment' || 'Publish production image' }}
    needs: [build, verify]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.channel || 'production' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout trusted workflow policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require main ancestry before executing candidate code
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: bash scripts/verify-release.sh "$COMMIT_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to replace an existing SHA release
        env:
          RELEASE: ${{ needs.build.outputs.image }}:${{ inputs.channel == 'prerelease' && 'stack-prerelease' || 'production' }}-${{ inputs.commit_sha }}
        run: |
          if docker buildx imagetools inspect "$RELEASE" > /tmp/release-inspect.log 2>&1; then
            echo 'This SHA is already released. Deploy its existing digest.' >&2
            exit 1
          fi
          if ! grep -Eiq 'manifest unknown|not found' /tmp/release-inspect.log; then
            cat /tmp/release-inspect.log >&2
            exit 1
          fi

      - name: Download verified scan report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-vulnerability-report

      - name: Recheck exception expiry before publication
        run: node scripts/check-vulnerabilities.cjs vulnerability-report.json security/vulnerability-exceptions.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify the candidate digest
        env:
          IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign verify "$IMAGE" \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Publish release aliases and deployment reference
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          RELEASE: ${{ needs.build.outputs.image }}:${{ inputs.channel == 'prerelease' && 'stack-prerelease' || 'production' }}-${{ inputs.commit_sha }}
          DIGEST: ${{ needs.build.outputs.digest }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CHANNEL: ${{ inputs.channel || 'production' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          aliases=(-t "$RELEASE")
          if [ "$CHANNEL" = production ]; then
            aliases+=(-t "$IMAGE:production" -t "$IMAGE:latest")
          elif [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$COMMIT_SHA" ]; then
            aliases+=(-t "$IMAGE:stack-prerelease")
          fi
          docker buildx imagetools create --prefer-index=false \
            "${aliases[@]}" "$IMAGE@$DIGEST"
          test "$(docker buildx imagetools inspect "$RELEASE" --format '{{.Manifest.Digest}}')" = "$DIGEST"
          printf '%s\n' "$IMAGE@$DIGEST" > production-image.txt
          {
            echo "### $CHANNEL image released"
            echo "Commit: \`$COMMIT_SHA\`"
            echo "Deploy: \`$IMAGE@$DIGEST\`"
            echo 'Tests, vulnerability scan, SBOM, provenance and signature completed.'
            if [ "$CHANNEL" = production ]; then
              echo 'Production deployment is manual.'
            else
              echo 'The main-head release is available to opt-in prerelease updaters.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save deployment reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-image
          path: production-image.txt

      - name: Notify prerelease deployment after publication
        if: inputs.channel == 'prerelease' && vars.STACK_PRERELEASE_WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ vars.STACK_PRERELEASE_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.STACK_PRERELEASE_WEBHOOK_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          [[ "$WEBHOOK_URL" = https://* ]]
          test -n "$WEBHOOK_TOKEN"
          # Only notify for the digest currently promoted to the prerelease channel.
          if [ "$(docker buildx imagetools inspect "$IMAGE:stack-prerelease" --format '{{.Manifest.Digest}}')" != "$DIGEST" ]; then
            echo 'The prerelease channel points to another release; skipping notification.'
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 \
            --request POST --header "X-Webhook-Token: $WEBHOOK_TOKEN" "$WEBHOOK_URL"
          echo 'Webhook accepted; deployment completion must be checked on the host.' >> "$GITHUB_STEP_SUMMARY"
